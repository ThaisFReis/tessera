<title>Tessera Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500&family=Martian+Mono:wght@300;400&display=swap">
<style>
/* Os tokens são os do deck, inteiros. O produto e a apresentação têm de
   parecer uma coisa só, e o custo de design disso é zero. (UX.md §8)
   Este console é deliberadamente de um só mundo visual: um visor escuro,
   igual ao deck. Tudo é pintado explicitamente. */
:root{
  --fundo:#141613; --profundo:#0E100D; --hairline:#2A2D27;
  --texto:#ECEFE6; --secundario:#9AA093; --apagado:#6B7065;
  --acento:#C8F24F; --recusa:#FF6B4A;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Space Grotesk",system-ui,sans-serif;
  --mono:"Martian Mono","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.pag{max-width:900px; margin:0 auto; padding-block:0 72px; padding-left:20px; padding-right:20px}
a{color:var(--acento); text-decoration:none; border-bottom:1px solid rgba(200,242,79,.3)}
a:hover{border-bottom-color:var(--acento)}
:focus-visible{outline:2px solid var(--acento); outline-offset:3px}

/* ---- cabeçalho ---- */
.topo{padding-block:40px 24px; border-bottom:1px solid var(--hairline)}
.marca{font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--acento)}
.aviso-escopo{margin-top:6px; font-size:13px; color:var(--apagado); max-width:62ch}
.meta{display:flex; flex-wrap:wrap; gap:4px 28px; margin-top:20px;
  font-family:var(--mono); font-size:11px; color:var(--secundario)}
.meta b{color:var(--texto); font-weight:400}

/* ---- seções ---- */
section{padding-block:52px; border-bottom:1px solid var(--hairline)}
.olho{font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--apagado); margin:0 0 14px}
h1{font-family:var(--serif); font-weight:400; font-size:clamp(30px,5.2vw,46px);
  line-height:1.1; margin:14px 0 0; text-wrap:balance}
h2{font-family:var(--serif); font-weight:400; font-size:clamp(23px,3.4vw,31px);
  line-height:1.15; margin:0 0 10px; text-wrap:balance}
p{margin:0 0 14px; max-width:66ch}
.dim{color:var(--secundario)}
.peq{font-size:13px}

/* ---- pares rótulo/valor, iguais aos da CLI ---- */
.pares{display:grid; grid-template-columns:auto 1fr; gap:7px 16px;
  font-family:var(--mono); font-size:12px; margin:0}
.pares dt{color:var(--secundario); white-space:nowrap}
.pares dd{margin:0; color:var(--texto); font-variant-numeric:tabular-nums}

/* ---- o bloco de hex: o material do produto ---- */
.hex{font-family:var(--mono); font-weight:300; font-size:10px; line-height:1.5;
  color:var(--secundario); word-break:break-all; letter-spacing:.02em;
  background:var(--profundo); border:1px solid var(--hairline);
  padding:12px; border-radius:2px; overflow-wrap:anywhere}

/* ---- as duas cédulas, lado a lado, sem dizer qual é qual ---- */
.par-cedula{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:24px 0 0}
.cedula-rot{font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--texto); margin-bottom:8px}
.frase-dura{font-family:var(--serif); font-size:clamp(19px,2.8vw,25px);
  line-height:1.3; margin:28px 0 0; max-width:30ch}

/* ---- A GRADE. A imagem do pitch. ---- */
.grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px; margin:26px 0 0}
.bloco{background:var(--profundo); border:1px solid var(--hairline);
  border-radius:2px; padding:9px; font-family:var(--mono); font-weight:300;
  font-size:7.5px; line-height:1.45; color:var(--apagado);
  word-break:break-all; overflow-wrap:anywhere; aspect-ratio:1/1;
  overflow:hidden}
.legenda-grade{margin-top:18px; font-size:13px; color:var(--secundario); max-width:62ch}

/* ---- tabela de votos ---- */
.rolo{overflow-x:auto; margin-top:22px}
table{border-collapse:collapse; width:100%; font-family:var(--mono); font-size:11px}
th{text-align:left; font-weight:400; color:var(--apagado); text-transform:uppercase;
  letter-spacing:.1em; font-size:9.5px; padding:0 14px 8px 0; white-space:nowrap}
td{padding:7px 14px 7px 0; border-top:1px solid var(--hairline);
  color:var(--secundario); white-space:nowrap; font-variant-numeric:tabular-nums}
td.n{color:var(--texto)}
.selo{display:inline-block; padding:1px 7px; border-radius:2px; font-size:9.5px;
  letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--hairline)}
.selo.sigilo{color:var(--texto); border-color:var(--secundario)}
.selo.aberto{color:var(--apagado)}

/* ---- apuração: a cadeia de confiança, de cima para baixo ---- */
.degrau{border-left:1px solid var(--hairline); padding-left:20px; margin-top:26px}
.degrau h3{font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--apagado); font-weight:400; margin:0 0 12px}
.placar{font-family:var(--serif); font-size:clamp(34px,7vw,64px); line-height:1;
  margin:34px 0 0; text-align:center}
.placar small{display:block; font-family:var(--mono); font-size:11px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--secundario);
  margin-top:14px}

/* ---- veredito: glyph + palavra, nunca só cor ---- */
.linha-v{display:flex; align-items:baseline; gap:12px; padding:6px 0;
  border-top:1px solid var(--hairline); font-family:var(--mono); font-size:12px}
.linha-v:first-child{border-top:0}
.linha-v .rot{color:var(--secundario); flex:1 1 auto}
.linha-v .val{color:var(--texto); font-variant-numeric:tabular-nums}
.linha-v .ok{color:var(--acento); white-space:nowrap}
.linha-v .nao{color:var(--recusa); white-space:nowrap}
.fecha{margin-top:24px; font-family:var(--mono); font-size:13px; color:var(--acento)}
.fecha.ruim{color:var(--recusa)}
.ausencia{margin-top:30px; padding-top:22px; border-top:1px solid var(--hairline)}
.ausencia .q{font-family:var(--serif); font-size:clamp(20px,3vw,27px);
  line-height:1.25; margin:8px 0 0; max-width:34ch}

/* ---- rodapé e carga de outro JSON ---- */
.rodape{padding-block:40px 0; font-size:13px; color:var(--apagado)}
.carga{margin-top:26px; padding:16px; border:1px dashed var(--hairline);
  border-radius:2px; font-size:12px; color:var(--apagado)}
.carga label{color:var(--secundario); cursor:pointer}
input[type=file]{font-family:var(--mono); font-size:11px; color:var(--secundario);
  margin-top:8px; max-width:100%}

@media (max-width:620px){
  .par-cedula{grid-template-columns:1fr}
  /* Em tela estreita o bloco encolhe, e 192 caracteres têm de continuar
     cabendo: hex cortado é bug, e cortado DIFERENTE entre dois blocos
     destruiria a única coisa que esta grade existe para mostrar. */
  .grade{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .bloco{font-size:6.3px; padding:7px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="pag">
  <header class="topo">
    <div class="marca">Tessera · console</div>
    <p class="aviso-escopo">
      Visor sobre a saída da CLI. Não é um aplicativo: não tem carteira, não tem
      servidor e não assina nada. Lê o <code>estado/&lt;proposta&gt;.json</code>
      que a CLI escreve e desenha os três momentos.
    </p>
    <dl class="meta" id="meta"></dl>
  </header>

  <main id="app"></main>

  <footer class="rodape">
    <p>
      Tessera — voto secreto para qualquer governança, na Stellar.
      <a href="https://github.com/ThaisFReis/tessera">código e especificação</a>
    </p>
    <div class="carga">
      <label for="arq">Para ver outra votação, abra o JSON que a CLI gravou:</label><br>
      <input type="file" id="arq" accept="application/json,.json">
      <div id="erro" style="margin-top:8px;color:var(--recusa)" hidden></div>
    </div>
  </footer>
</div>

<script>
"use strict";

const $ = (s) => document.querySelector(s);
const el = (t, cls, txt) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};
const curto = (s, a = 8, b = 4) =>
  !s ? "—" : s.length <= a + b + 1 ? s : s.slice(0, a) + "…" + s.slice(-b);
const num = (n) => n.toLocaleString("pt-BR");
const MAIUSC = (s) => s.toLocaleUpperCase("pt-BR");

function expert(d, tipo, id) {
  return `https://stellar.expert/explorer/${d.rede || "testnet"}/${tipo}/${id}`;
}

/* ---------- a cédula ---------- */
/* Quantas opções sigilosas a cédula tem somadas: é o tamanho dos vetores de
   compromisso, de prova e de abertura. */
const opcoesConf = (d) =>
  d.perguntas.filter((p) => p.confidencial).reduce((a, p) => a + p.opcoes.length, 0);

/* Quantas perguntas sigilosas — o número de provas de soma por cédula. */
const nPerguntasConf = (d) => d.perguntas.filter((p) => p.confidencial).length;

/* Uma cédula mista tem as duas naturezas. Toda sigilosa ou toda aberta não é
   mista — e a palavra só aparece na tela quando ela é verdade. */
const eMista = (d) =>
  d.perguntas.some((p) => p.confidencial) && d.perguntas.some((p) => !p.confidencial);

/* A contagem, opção a opção, somando a parte que a mesa abriu com a parte que
   já estava em claro.

   As duas origens do "em claro" são diferentes, e é por isso que isto não é
   um `zip`: quem votou em sigilo respondeu em claro **só as perguntas
   públicas**, e quem abriu o voto respondeu em claro a **cédula inteira**. */
function contagem(d, afirmado) {
  const varias = d.perguntas.filter((p) => p.confidencial).length > 1;
  const r = [];
  let offTodas = 0, offPubl = 0, offConf = 0;

  d.perguntas.forEach((pg, q) => {
    pg.opcoes.forEach((o, j) => {
      let claro = 0;
      d.votos.forEach((v) => {
        if (!v.escolhas) return;
        if (v.publico) claro += v.escolhas[offTodas + j] || 0;
        else if (!pg.confidencial) claro += v.escolhas[offPubl + j] || 0;
      });
      const segredo = pg.confidencial ? (afirmado[offConf + j] ?? 0) : 0;
      r.push({
        rotulo: varias && pg.confidencial ? `${q + 1}·${o}` : o,
        confidencial: pg.confidencial,
        segredo,
        claro,
        total: segredo + claro,
      });
    });
    offTodas += pg.opcoes.length;
    if (pg.confidencial) offConf += pg.opcoes.length;
    else offPubl += pg.opcoes.length;
  });
  return r;
}

/* Cabeçalho: de onde vem cada número que a página mostra. */
function cabecalho(d) {
  const m = $("#meta");
  m.replaceChildren();
  const par = (k, v, href) => {
    m.append(el("dt", null, k));
    const dd = el("dd");
    if (href) {
      const a = el("a", null, v);
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      dd.append(a);
    } else dd.textContent = v;
    m.append(dd);
  };
  par("contrato", curto(d.contrato, 8, 4), expert(d, "contract", d.contrato));
  par("rede", d.rede || "testnet");
  par("raiz de aptos", curto(d.raiz_aptos, 6, 4));
  par("mesa", `${d.mesa.limiar} de ${d.mesa.membros}`);
  par("sigilo mínimo", String(d.sigilo_minimo));
}

/* ---------- Momento 1 — Cédula ---------- */
/* As duas cédulas são DADOS REAIS do ledger: os dois compromissos que a
   primeira votante confidencial publicou. Um comete 1 e o outro comete 0.
   Rotular A e B em vez de "aprovar" e "rejeitar" é deliberado: assim que você
   nomeia, a pessoa para de olhar os bytes e começa a ler o rótulo. */
function momentoCedula(d) {
  const s = el("section");
  s.append(el("p", "olho", "Momento 1 · cédula"));
  /* A primeira pergunta sigilosa: é dela que sai o par de compromissos.
     Numa cédula mista as públicas não têm o que mostrar aqui — elas já
     estão em claro no ledger. */
  const qSig = d.perguntas.findIndex((p) => p.confidencial);
  if (qSig < 0) {
    s.append(el("h1", null, d.perguntas[0]?.texto || "Cédula"));
    s.append(el("p", "dim", "Esta cédula é toda pública: não há compromisso a mostrar."));
    return s;
  }
  const pg = d.perguntas[qSig];
  s.append(el("h1", null, pg.texto));

  const sigilosos = d.votos.filter((v) => !v.publico && v.compromissos?.length >= 2);
  if (!sigilosos.length) {
    s.append(el("p", "dim", "Ninguém votou em segredo nesta proposta ainda."));
    return s;
  }
  const v = sigilosos[0];
  /* Onde começa a fatia desta pergunta dentro dos compromissos achatados. */
  const desloc = d.perguntas
    .slice(0, qSig)
    .filter((p) => p.confidencial)
    .reduce((a, p) => a + p.opcoes.length, 0);

  const sub = el("p", "dim");
  sub.textContent =
    `Os dois objetos abaixo estão no ledger agora, publicados pela mesma pessoa, ` +
    `na mesma transação. Um deles comete um voto e o outro comete a ausência dele.`;
  s.append(sub);

  const par = el("div", "par-cedula");
  ["A", "B"].forEach((rot, i) => {
    const col = el("div");
    col.append(el("div", "cedula-rot", `Cédula ${rot}`));
    col.append(el("div", "hex", v.compromissos[desloc + i]));
    par.append(col);
  });
  s.append(par);

  const p2 = el("p", "peq dim");
  p2.style.marginTop = "14px";
  p2.textContent = `96 bytes cada. Um é "${pg.opcoes[0]}" e o outro é "${pg.opcoes[1]}".`;
  s.append(p2);

  /* Esta frase não pode ser suavizada. É a única vez no produto em que um
     superlativo é literalmente correto, porque a garantia é
     information-theoretic e não computacional. (UX-CLI §2.2) */
  const dura = el("div", "frase-dura");
  dura.append(document.createTextNode("Não existe cálculo, computador ou tempo que diga qual é qual."));
  s.append(dura);
  const p3 = el("p", "peq dim");
  p3.style.marginTop = "12px";
  p3.textContent = "Nem hoje, nem em cinquenta anos. É o que ela publicou.";
  s.append(p3);

  return s;
}

/* ---------- A grade. A imagem do pitch. ---------- */
/* A grade de blocos indistinguíveis não existe em terminal, e é a razão de
   este console existir (UX.md §7, Nível 2). */
function grade(d) {
  const s = el("section");
  s.append(el("p", "olho", "o que a rede guarda, para sempre"));
  s.append(el("h2", null, "Todos os compromissos, lado a lado"));

  const sigilosos = d.votos.filter((v) => !v.publico);
  const todos = [];
  sigilosos.forEach((v) => (v.compromissos || []).forEach((c) => todos.push(c)));
  if (!todos.length) {
    s.append(el("p", "dim", "Nenhuma cédula confidencial nesta proposta."));
    return s;
  }

  const g = el("div", "grade");
  todos.forEach((c) => g.append(el("div", "bloco", c)));
  s.append(g);

  const uns = sigilosos.length;
  const leg = el("p", "legenda-grade");
  leg.textContent =
    `${num(todos.length)} objetos, de ${num(uns)} pessoas, ${num(opcoesConf(d))} por cédula. ` +
    `${num(uns)} deles cometem um voto e ${num(todos.length - uns)} cometem a ausência dele. ` +
    `Qual é qual não está aqui, e não vai estar nunca — nem para quem apura, ` +
    `nem para quem escreveu este código.`;
  s.append(leg);
  return s;
}

/* ---------- Momento 2 — Conferência ---------- */
function momentoConferencia(d) {
  const s = el("section");
  s.append(el("p", "olho", "Momento 2 · conferência"));
  s.append(el("h2", null, "Quem votou é público. Em quê, não."));
  s.append(
    el("p", "dim",
      "O ledger registra que aquela conta votou. É intencional: a governança " +
      "precisa de quórum, e sem isso não há como provar que ninguém votou duas vezes.")
  );

  /* Numa cédula mista o que vai em claro tem de estar escrito, não deduzido
     de um selo na tabela. */
  if (eMista(d)) {
    const m = el("div", "degrau");
    m.append(el("h3", null, "esta cédula é mista"));
    const dlm = el("dl", "pares");
    d.perguntas.forEach((pg, q) => {
      dlm.append(el("dt", null, `${q + 1}. ${pg.texto}`));
      dlm.append(el("dd", null, pg.confidencial ? "em sigilo" : "em aberto, no ledger"));
    });
    m.append(dlm);
    const nm = el("p", "peq dim");
    nm.style.marginTop = "12px";
    nm.textContent =
      "A natureza de cada pergunta é da proposta, não de quem vota: toda cédula " +
      "tem a mesma forma, e não há nada a inferir da forma.";
    m.append(nm);
    s.append(m);
  }

  const rolo = el("div", "rolo");
  const t = el("table");
  const thead = el("thead");
  const tr = el("tr");
  ["#", "conta", "cédula", "ledger", "transação"].forEach((h) => tr.append(el("th", null, h)));
  thead.append(tr);
  t.append(thead);

  const tb = el("tbody");
  d.votos.forEach((v) => {
    const r = el("tr");
    r.append(el("td", "n", String(v.posicao)));
    r.append(el("td", null, curto(v.endereco, 6, 4)));
    const td = el("td");
    const sel = el("span", v.publico ? "selo aberto" : "selo sigilo",
      v.publico ? "aberta por inteiro" : (eMista(d) ? "mista" : "em segredo"));
    td.append(sel);
    r.append(td);
    r.append(el("td", null, num(v.ledger)));
    const tdtx = el("td");
    const a = el("a", null, curto(v.tx, 8, 0));
    a.href = expert(d, "tx", v.tx);
    a.target = "_blank";
    a.rel = "noopener";
    tdtx.append(a);
    r.append(tdtx);
    tb.append(r);
  });
  t.append(tb);
  rolo.append(t);
  s.append(rolo);

  /* A lacuna N2, dita em voz alta. Não é erro, é a verdade sobre o estado do
     mundo — por isso não leva vermelho. */
  const av = el("div", "degrau");
  av.style.marginTop = "34px";
  av.append(el("h3", null, "o que o protocolo não garante"));
  av.append(
    el("p", "peq dim",
      "Quem vota conhece o próprio fator de aleatoriedade e consegue provar o " +
      "voto a um terceiro. O protocolo remove o registro público permanente; " +
      "não remove a capacidade de alguém se auto-incriminar. O cliente grava " +
      "essa chave num arquivo e manda apagá-la — e depois de apagada, nem " +
      "quem votou consegue provar em que votou.")
  );
  s.append(av);
  return s;
}

/* ---------- Momento 3 — Apuração ---------- */
/* a mesa afirmou → o contrato conferiu → o resultado.
   A ordem é a arquitetura de confiança impressa de cima para baixo, e ensina
   sozinha por que não é preciso confiar na mesa. */
function momentoApuracao(d) {
  const s = el("section");
  s.append(el("p", "olho", "Momento 3 · apuração"));

  if (!d.apuracao) {
    s.append(el("h2", null, "Ainda não apurada"));
    const conf = d.votos.filter((v) => !v.publico).length;
    s.append(
      el("p", "dim",
        conf > 0 && conf < d.sigilo_minimo
          ? `Há ${conf} cédulas em segredo e o mínimo é ${d.sigilo_minimo}. ` +
            `Com tão poucas, publicar o total revelaria esses votos por subtração: ` +
            `quem votou em público é conhecido, e o resto sai por diferença. ` +
            `O contrato recusa, e nenhum voto foi perdido.`
          : "A janela de votação ainda está aberta.")
    );
    return s;
  }

  s.append(el("h2", null, "A mesa afirma. O contrato confere."));

  const afirmado = d.apuracao.afirmado || [];
  const conta = contagem(d, afirmado);

  const d1 = el("div", "degrau");
  d1.append(el("h3", null, "a mesa afirmou"));
  const dl = el("dl", "pares");
  conta.forEach((c) => {
    dl.append(el("dt", null, MAIUSC(c.rotulo)));
    dl.append(el("dd", null, c.confidencial
      ? `${c.segredo} em segredo + ${c.claro} em público`
      : `${c.claro} em público — esta pergunta é aberta`));
  });
  d1.append(dl);
  s.append(d1);

  const d2 = el("div", "degrau");
  d2.append(el("h3", null, "o contrato conferiu"));
  conta.filter((c) => c.confidencial).forEach((c) => {
    const l = el("div", "linha-v");
    l.append(el("span", "rot", `Acumulado ${MAIUSC(c.rotulo)}`));
    l.append(el("span", "val", `${c.segredo}·G + R·H`));
    l.append(el("span", d.apuracao.confere ? "ok" : "nao",
      d.apuracao.confere ? "✓ fecha" : "✗ não fecha"));
    d2.append(l);
  });
  const nota = el("p", "peq dim");
  nota.style.marginTop = "14px";
  nota.textContent =
    "Para afirmar outro total, a mesa teria de resolver um log discreto em " +
    "BLS12-381. Não é denúncia depois: é recusa na hora.";
  d2.append(nota);
  s.append(d2);

  const d3 = el("div", "degrau");
  d3.append(el("h3", null, "publicado"));
  const dl3 = el("dl", "pares");
  dl3.append(el("dt", null, "transação"));
  const dd3 = el("dd");
  const a3 = el("a", null, curto(d.apuracao.tx, 10, 4));
  a3.href = expert(d, "tx", d.apuracao.tx);
  a3.target = "_blank";
  a3.rel = "noopener";
  dd3.append(a3);
  dl3.append(dd3);
  dl3.append(el("dt", null, "ledger"));
  dl3.append(el("dd", null, num(d.apuracao.ledger)));
  dl3.append(el("dt", null, "endossos"));
  dl3.append(el("dd", null, `${d.mesa.limiar} de ${d.mesa.membros} membros da mesa`));
  d3.append(dl3);
  s.append(d3);

  /* O resultado vem DEPOIS da conferência e é a única linha centrada: a ordem
     comunica que o número só vale porque passou pelo bloco acima. */
  /* Um placar por pergunta. Numa cédula mista as duas naturezas aparecem
     lado a lado, e a diferença entre elas é dita, não deduzida. */
  let off = 0;
  d.perguntas.forEach((pg, q) => {
    const fatia = conta.slice(off, off + pg.opcoes.length);
    off += pg.opcoes.length;
    let vence = 0;
    fatia.forEach((c, j) => { if (c.total > fatia[vence].total) vence = j; });
    if (d.perguntas.length > 1) {
      const t = el("p", "peq dim");
      t.style.marginTop = "22px";
      t.textContent = `${q + 1}. ${pg.texto}  ·  ${pg.confidencial ? "em sigilo" : "em aberto"}`;
      s.append(t);
    }
    const placar = el("div", "placar");
    placar.append(document.createTextNode(MAIUSC(pg.opcoes[vence])));
    placar.append(el("small", null,
      fatia.map((c) => c.total).sort((a, b) => b - a).join(" a ") +
      " · " + num(d.votos.length) + " votos"));
    s.append(placar);
  });
  return s;
}

/* ---------- O verificador. A tela do cético, e do jurado. ---------- */
function verificador(d) {
  const s = el("section");
  s.append(el("p", "olho", "verificador independente"));
  s.append(el("h2", null, "Confia em nada."));
  s.append(
    el("p", "dim",
      "Processo separado. Não fala com o contrato: relê o ledger, recalcula a " +
      "raiz de aptos, reverifica cada prova e refaz o agregado.")
  );

  const v = d.verificacao;
  if (!v) {
    s.append(el("p", "dim", "Nenhuma verificação registrada para esta proposta."));
    return s;
  }
  const conf = d.votos.filter((x) => !x.publico).length;
  const linhas = [
    ["Aptidão", `${d.aptos.length} de ${d.aptos.length} na raiz ${curto(d.raiz_aptos, 4, 4)}`, v.aptidao],
    ["Unicidade", "0 repetidos", v.unicidade],
    ["Boa formação", `${conf * opcoesConf(d)} disjuntivas válidas`, v.boa_formacao],
    ["Soma por pergunta", `${conf * nPerguntasConf(d)} de ${conf * nPerguntasConf(d)} somam 1`, v.boa_formacao],
    ["Respostas em claro", `${d.votos.filter((x) => x.escolhas).length} conferem`, v.aberturas],
    ["Sigilo mínimo", `${conf} confidenciais ≥ ${d.sigilo_minimo}`, v.sigilo_minimo],
    ["Agregado refeito", "bate com o acumulador do contrato", v.agregado],
  ];
  const caixa = el("div");
  caixa.style.marginTop = "22px";
  linhas.forEach(([rot, val, ok]) => {
    const l = el("div", "linha-v");
    l.append(el("span", "rot", rot));
    l.append(el("span", "val", val));
    l.append(el("span", ok ? "ok" : "nao", ok ? "✓ confere" : "✗ não confere"));
    caixa.append(l);
  });
  s.append(caixa);

  const tudo = Object.values(v).every(Boolean);
  const f = el("p", tudo ? "fecha" : "fecha ruim",
    tudo ? "✓ o resultado publicado é o resultado correto"
         : "✗ alguma coisa não fecha");
  s.append(f);

  /* O bloco que resolve o problema de design: o valor é uma ausência, e aqui a
     ausência vira saída afirmativa de uma ferramenta hostil. Não é o produto
     prometendo sigilo — é um auditor que tentou tudo, provou o que podia, e
     relata o que não conseguiu. */
  const aus = el("div", "ausencia");
  aus.append(el("div", "olho", "e o que este verificador não conseguiu descobrir"));
  aus.append(el("p", "q", `Em que cada uma das ${num(conf)} pessoas votou.`));
  s.append(aus);
  return s;
}

/* ---------- desenho ---------- */
function desenhar(d) {
  cabecalho(d);
  const app = $("#app");
  app.replaceChildren(
    momentoCedula(d),
    grade(d),
    momentoConferencia(d),
    momentoApuracao(d),
    verificador(d)
  );
  document.title = `Tessera Console · ${d.proposta}`;
}

function erro(msg) {
  const e = $("#erro");
  e.textContent = msg;
  e.hidden = false;
}

function valido(d) {
  return d && Array.isArray(d.perguntas) && d.perguntas.length > 0 &&
         d.perguntas.every((p) => Array.isArray(p.opcoes) && p.opcoes.length >= 2) &&
         Array.isArray(d.votos) && Array.isArray(d.aptos) && d.mesa;
}

/* O instantâneo embutido é uma rodada de verdade na testnet, para que a página
   abra mostrando algo em vez de um formulário vazio. `?p=<proposta>` lê o JSON
   que a CLI gravou ao lado; o seletor de arquivo serve para qualquer outro. */
function inicial() {
  try {
    const bruto = document.getElementById("instantaneo").textContent.trim();
    if (bruto && bruto.charAt(0) === "{") {
      const d = JSON.parse(bruto);
      if (valido(d)) return d;
    }
  } catch (_) {}
  return null;
}

const embutido = inicial();
if (embutido) desenhar(embutido);

const p = new URLSearchParams(location.search).get("p");
if (p && /^[a-zA-Z0-9_-]+$/.test(p)) {
  fetch(`../estado/${p}.json`)
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
    .then((d) => { if (valido(d)) desenhar(d); })
    .catch(() => erro(`Não encontrei estado/${p}.json ao lado desta página.`));
}

$("#arq").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  $("#erro").hidden = true;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(String(fr.result));
      if (!valido(d)) throw new Error("formato");
      desenhar(d);
      scrollTo({ top: 0, behavior: "smooth" });
    } catch (_) {
      erro("Esse arquivo não é um estado do Tessera.");
    }
  };
  fr.onerror = () => erro("Não consegui ler o arquivo.");
  fr.readAsText(f);
});
</script>
