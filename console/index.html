<title>Tessera Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500&family=Martian+Mono:wght@300;400&display=swap">
<style>
/* Os tokens são os do deck, inteiros. O produto e a apresentação têm de
   parecer uma coisa só, e o custo de design disso é zero. (UX.md §8)
   Este console é deliberadamente de um só mundo visual: um visor escuro,
   igual ao deck. Tudo é pintado explicitamente. */
:root{
  --fundo:#141613; --profundo:#0E100D; --hairline:#2A2D27;
  --texto:#ECEFE6; --secundario:#9AA093; --apagado:#6B7065;
  --acento:#C8F24F; --recusa:#FF6B4A;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Space Grotesk",system-ui,sans-serif;
  --mono:"Martian Mono","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.pag{max-width:1440px; margin:0 auto; padding-block:0 72px; padding-left:clamp(20px,4vw,64px); padding-right:clamp(20px,4vw,64px)}
a{color:var(--acento); text-decoration:none; border-bottom:1px solid rgba(200,242,79,.3)}
a:hover{border-bottom-color:var(--acento)}
:focus-visible{outline:2px solid var(--acento); outline-offset:3px}

/* ---- cabeçalho ---- */
.topo{padding-block:40px 24px; border-bottom:1px solid var(--hairline)}
.marca{font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--acento)}
.aviso-escopo{margin-top:6px; font-size:13px; color:var(--apagado); max-width:62ch}
.meta{display:flex; flex-wrap:wrap; gap:4px 28px; margin-top:20px;
  font-family:var(--mono); font-size:11px; color:var(--secundario)}
.meta b{color:var(--texto); font-weight:400}
.roteiro{display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 0; border-bottom:1px solid var(--hairline)}
.ato{font:10px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--acento)}
.passos{font:11px var(--mono); color:var(--secundario)}
.navegacao{display:flex; align-items:center; gap:10px}
button{font:inherit; cursor:pointer}
.nav-btn,.acao,.natureza{background:transparent; color:var(--texto); border:1px solid var(--hairline); border-radius:2px}
.nav-btn{padding:9px 13px; font:11px var(--mono)}
.nav-btn:hover,.natureza:hover{border-color:var(--secundario)}
.nav-btn:disabled{opacity:.35; cursor:default}
.acao{display:inline-block; padding:13px 18px; margin-top:20px; background:var(--acento); color:var(--profundo); border-color:var(--acento); font:11px var(--mono); text-transform:uppercase; letter-spacing:.08em}
.acao:hover{filter:brightness(1.08)}
.palco{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.75fr); min-height:670px}
.palco>section{padding:clamp(28px,4vw,58px) clamp(20px,4vw,60px) 50px 0; border:0}
.mecanica{padding:clamp(24px,3vw,40px) 0 50px clamp(20px,2.5vw,36px); border-left:1px solid var(--hairline); background:var(--profundo)}
.term{font:11px/1.7 var(--mono); overflow-wrap:anywhere}
.term-topo{color:var(--apagado); letter-spacing:.14em; font-size:9px;
  padding-bottom:10px; margin-bottom:14px; border-bottom:1px solid var(--hairline)}
.t-cod{color:var(--texto); white-space:pre-wrap}
.t-com{color:var(--apagado)}
.t-chv{color:var(--secundario)}
.t-val{color:var(--acento)}
.t-ok{color:var(--acento)}
.t-x{color:var(--recusa)}
.t-nota{color:var(--secundario); font:12px/1.6 var(--sans); margin:14px 0 0;
  padding-top:12px; border-top:1px solid var(--hairline)}
.t-vazio{height:10px}
.t-oculto{white-space:pre; color:transparent; background:repeating-linear-gradient(90deg,var(--hairline) 0 4px,transparent 4px 7px);
  padding:0 4px; border-radius:2px}
.painel-tag{font:10px var(--mono); color:var(--secundario); letter-spacing:.12em; text-transform:uppercase}
.marca-painel{font:11px var(--mono); color:var(--acento); margin-bottom:22px}
.diario{font:10.5px/1.65 var(--mono); max-height:330px; overflow-y:auto;
  margin-bottom:22px; padding-right:6px; overflow-wrap:anywhere}
.d-linha{display:flex; gap:9px; align-items:baseline}
.d-hora{color:var(--hairline); flex:0 0 auto}
.d-cmd{color:var(--acento); font-weight:500}
.d-fn{color:var(--texto)}
.d-val{color:var(--secundario)}
.d-hex{color:var(--apagado); font-size:9px}
.d-tx{color:var(--acento)}
.d-ok::before{content:"✓ "}
.d-ok{color:var(--acento)}
.d-x::before{content:"✗ "}
.d-x{color:var(--recusa)}
.d-com::before{content:"// "}
.d-com{color:var(--apagado)}
.d-ocl{color:transparent; white-space:pre;
  background:repeating-linear-gradient(90deg,var(--hairline) 0 4px,transparent 4px 7px)}
.rolo-cli{font:11px/1.45 var(--mono); white-space:pre-wrap; word-break:break-word; max-height:300px; overflow-y:auto; margin:10px 0 0; color:var(--secundario); background:var(--profundo); padding:12px}
.selo-vivo,.selo-eco{font:9px var(--mono); letter-spacing:.14em; padding:2px 7px; border-radius:999px; vertical-align:middle; white-space:nowrap}
.selo-vivo{color:var(--acento); border:1px solid var(--acento)}
.selo-eco{color:var(--apagado); border:1px solid var(--hairline)}
select.campo-demo{appearance:none}
.aviso-demo{font:11px var(--mono); color:var(--secundario); border:1px solid var(--hairline); padding:12px; margin:20px 0}
.cartao{border:1px solid var(--hairline); background:var(--profundo); padding:20px; margin:20px 0}
.cartao h3{margin:0 0 12px; font:11px var(--mono); color:var(--secundario); letter-spacing:.08em; text-transform:uppercase}
.pergunta-demo{border-top:1px solid var(--hairline); padding:18px 0}
.pergunta-demo:first-child{border-top:0}
.pergunta-demo h3{font:17px var(--sans); font-weight:500; margin:0 0 14px}
.campo-demo{display:block; width:100%; padding:10px 12px; margin:7px 0; color:var(--texto); background:var(--fundo); border:1px solid var(--hairline); border-radius:2px; font:13px var(--sans)}
.campo-demo:focus{border-color:var(--acento);outline:none}
.campo-rot{display:block; margin-top:10px; font:10px var(--mono); color:var(--secundario); text-transform:uppercase; letter-spacing:.08em}
.grupo-opcoes{display:flex; flex-wrap:wrap; gap:8px}
.natureza{padding:10px 14px; font:11px var(--mono)}
.natureza[aria-pressed=true]{border-color:var(--texto); background:var(--texto); color:var(--profundo)}
.rotulo-natureza{display:block; margin-top:12px; font:10px var(--mono); color:var(--secundario)}
.destaque{font:clamp(26px,4vw,48px)/1.08 var(--serif); margin:20px 0; max-width:16ch}
.fato{color:var(--acento); font:11px var(--mono)}
.recusa-demo{border-left:2px solid var(--recusa); padding:16px; color:var(--recusa); background:rgba(255,107,74,.05); margin-top:18px; white-space:pre-line}
.linha-dado{font:11px var(--mono); color:var(--secundario); padding:8px 0; border-bottom:1px solid var(--hairline); overflow-wrap:anywhere}
.linha-dado b{color:var(--texto); font-weight:400}

/* ---- seções ---- */
section{padding-block:52px; border-bottom:1px solid var(--hairline)}
.olho{font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--apagado); margin:0 0 14px}
h1{font-family:var(--serif); font-weight:400; font-size:clamp(30px,5.2vw,46px);
  line-height:1.1; margin:14px 0 0; text-wrap:balance}
h2{font-family:var(--serif); font-weight:400; font-size:clamp(23px,3.4vw,31px);
  line-height:1.15; margin:0 0 10px; text-wrap:balance}
p{margin:0 0 14px; max-width:66ch}
.dim{color:var(--secundario)}
.peq{font-size:13px}

/* ---- pares rótulo/valor, iguais aos da CLI ---- */
.pares{display:grid; grid-template-columns:auto 1fr; gap:7px 16px;
  font-family:var(--mono); font-size:12px; margin:0}
.pares dt{color:var(--secundario); white-space:nowrap}
.pares dd{margin:0; color:var(--texto); font-variant-numeric:tabular-nums}

/* ---- o bloco de hex: o material do produto ---- */
.hex{font-family:var(--mono); font-weight:300; font-size:10px; line-height:1.5;
  color:var(--secundario); word-break:break-all; letter-spacing:.02em;
  background:var(--profundo); border:1px solid var(--hairline);
  padding:12px; border-radius:2px; overflow-wrap:anywhere}

/* ---- as duas cédulas, lado a lado, sem dizer qual é qual ---- */
.par-cedula{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:24px 0 0}
.cedula-rot{font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--texto); margin-bottom:8px}
.frase-dura{font-family:var(--serif); font-size:clamp(19px,2.8vw,25px);
  line-height:1.3; margin:28px 0 0; max-width:30ch}

/* ---- A GRADE. A imagem do pitch. ---- */
.grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px; margin:26px 0 0}
.bloco{background:var(--profundo); border:1px solid var(--hairline);
  border-radius:2px; padding:9px; font-family:var(--mono); font-weight:300;
  font-size:7.5px; line-height:1.45; color:var(--apagado);
  word-break:break-all; overflow-wrap:anywhere; aspect-ratio:1/1;
  overflow:hidden}
.legenda-grade{margin-top:18px; font-size:13px; color:var(--secundario); max-width:62ch}

/* ---- tabela de votos ---- */
.rolo{overflow-x:auto; margin-top:22px}
table{border-collapse:collapse; width:100%; font-family:var(--mono); font-size:11px}
th{text-align:left; font-weight:400; color:var(--apagado); text-transform:uppercase;
  letter-spacing:.1em; font-size:9.5px; padding:0 14px 8px 0; white-space:nowrap}
td{padding:7px 14px 7px 0; border-top:1px solid var(--hairline);
  color:var(--secundario); white-space:nowrap; font-variant-numeric:tabular-nums}
td.n{color:var(--texto)}
.selo{display:inline-block; padding:1px 7px; border-radius:2px; font-size:9.5px;
  letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--hairline)}
.selo.sigilo{color:var(--texto); border-color:var(--secundario)}
.selo.aberto{color:var(--apagado)}

/* ---- apuração: a cadeia de confiança, de cima para baixo ---- */
.degrau{border-left:1px solid var(--hairline); padding-left:20px; margin-top:26px}
.degrau h3{font-family:var(--mono); font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--apagado); font-weight:400; margin:0 0 12px}
.placar{font-family:var(--serif); font-size:clamp(34px,7vw,64px); line-height:1;
  margin:34px 0 0; text-align:center}
.placar small{display:block; font-family:var(--mono); font-size:11px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--secundario);
  margin-top:14px}

/* ---- veredito: glyph + palavra, nunca só cor ---- */
.linha-v{display:flex; align-items:baseline; gap:12px; padding:6px 0;
  border-top:1px solid var(--hairline); font-family:var(--mono); font-size:12px}
.linha-v:first-child{border-top:0}
.linha-v .rot{color:var(--secundario); flex:1 1 auto}
.linha-v .val{color:var(--texto); font-variant-numeric:tabular-nums}
.linha-v .ok{color:var(--acento); white-space:nowrap}
.linha-v .nao{color:var(--recusa); white-space:nowrap}
.fecha{margin-top:24px; font-family:var(--mono); font-size:13px; color:var(--acento)}
.fecha.ruim{color:var(--recusa)}
.ausencia{margin-top:30px; padding-top:22px; border-top:1px solid var(--hairline)}
.ausencia .q{font-family:var(--serif); font-size:clamp(20px,3vw,27px);
  line-height:1.25; margin:8px 0 0; max-width:34ch}

/* ---- rodapé e carga de outro JSON ---- */
.rodape{padding-block:40px 0; font-size:13px; color:var(--apagado)}
.carga{margin-top:26px; padding:16px; border:1px dashed var(--hairline);
  border-radius:2px; font-size:12px; color:var(--apagado)}
.carga label{color:var(--secundario); cursor:pointer}
input[type=file]{font-family:var(--mono); font-size:11px; color:var(--secundario);
  margin-top:8px; max-width:100%}

@media (max-width:620px){
  .palco{display:block}
  .palco>section{padding-right:0;min-height:420px}
  .mecanica{border-left:0;border-top:1px solid var(--hairline);padding:26px 0}
  .roteiro{flex-wrap:wrap}
  .par-cedula{grid-template-columns:1fr}
  /* Em tela estreita o bloco encolhe, e 192 caracteres têm de continuar
     cabendo: hex cortado é bug, e cortado DIFERENTE entre dois blocos
     destruiria a única coisa que esta grade existe para mostrar. */
  .grade{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .bloco{font-size:6.3px; padding:7px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="pag">
  <header class="topo">
    <div class="marca">Tessera · demonstração</div>
    <dl class="meta" id="meta"></dl>
  </header>

  <nav class="roteiro" aria-label="Navegação da demonstração">
    <div><div class="ato" id="ato"></div><div class="passos" id="passos"></div></div>
    <div class="navegacao"><button class="nav-btn" id="anterior" type="button">← anterior</button><button class="nav-btn" id="proximo" type="button">próximo →</button></div>
  </nav>

  <main id="app"></main>

  <footer class="rodape">
    <p>
      Tessera — voto secreto para qualquer governança, na Stellar.
      <a href="https://github.com/ThaisFReis/tessera">código e especificação</a>
    </p>
    <div class="carga">
      <label for="arq">Para ver outra votação, abra o JSON que a CLI gravou:</label><br>
      <input type="file" id="arq" accept="application/json,.json">
      <div id="erro" style="margin-top:8px;color:var(--recusa)" hidden></div>
    </div>
  </footer>
</div>

<script>
"use strict";

const $ = (s) => document.querySelector(s);
const el = (t, cls, txt) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};
const curto = (s, a = 8, b = 4) =>
  !s ? "—" : s.length <= a + b + 1 ? s : s.slice(0, a) + "…" + s.slice(-b);
const num = (n) => n.toLocaleString("pt-BR");
const MAIUSC = (s) => s.toLocaleUpperCase("pt-BR");

function expert(d, tipo, id) {
  return `https://stellar.expert/explorer/${d.rede || "testnet"}/${tipo}/${id}`;
}

/* ---------- a cédula ---------- */
/* Quantas opções sigilosas a cédula tem somadas: é o tamanho dos vetores de
   compromisso, de prova e de abertura. */
const opcoesConf = (d) =>
  d.perguntas.filter((p) => p.confidencial).reduce((a, p) => a + p.opcoes.length, 0);

/* Quantas perguntas sigilosas — o número de provas de soma por cédula. */
const nPerguntasConf = (d) => d.perguntas.filter((p) => p.confidencial).length;

/* Uma cédula mista tem as duas naturezas. Toda sigilosa ou toda aberta não é
   mista — e a palavra só aparece na tela quando ela é verdade. */
const eMista = (d) =>
  d.perguntas.some((p) => p.confidencial) && d.perguntas.some((p) => !p.confidencial);

/* A contagem, opção a opção, somando a parte que a mesa abriu com a parte que
   já estava em claro.

   As duas origens do "em claro" são diferentes, e é por isso que isto não é
   um `zip`: quem votou em sigilo respondeu em claro **só as perguntas
   públicas**, e quem abriu o voto respondeu em claro a **cédula inteira**. */
function contagem(d, afirmado) {
  const varias = d.perguntas.filter((p) => p.confidencial).length > 1;
  const r = [];
  let offTodas = 0, offPubl = 0, offConf = 0;

  d.perguntas.forEach((pg, q) => {
    pg.opcoes.forEach((o, j) => {
      let claro = 0;
      d.votos.forEach((v) => {
        if (!v.escolhas) return;
        if (v.publico) claro += v.escolhas[offTodas + j] || 0;
        else if (!pg.confidencial) claro += v.escolhas[offPubl + j] || 0;
      });
      const segredo = pg.confidencial ? (afirmado[offConf + j] ?? 0) : 0;
      r.push({
        rotulo: varias && pg.confidencial ? `${q + 1}·${o}` : o,
        confidencial: pg.confidencial,
        segredo,
        claro,
        total: segredo + claro,
      });
    });
    offTodas += pg.opcoes.length;
    if (pg.confidencial) offConf += pg.opcoes.length;
    else offPubl += pg.opcoes.length;
  });
  return r;
}

/* Cabeçalho: de onde vem cada número que a página mostra. */
function cabecalho(d) {
  if (!d) { $("#meta").replaceChildren(); return; }
  const m = $("#meta");
  m.replaceChildren();
  const par = (k, v, href) => {
    m.append(el("dt", null, k));
    const dd = el("dd");
    if (href) {
      const a = el("a", null, v);
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      dd.append(a);
    } else dd.textContent = v;
    m.append(dd);
  };
  par("contrato", curto(d.contrato, 8, 4), expert(d, "contract", d.contrato));
  par("rede", d.rede || "testnet");
  par("raiz de aptos", curto(d.raiz_aptos, 6, 4));
  par("mesa", `${d.mesa.limiar} de ${d.mesa.membros}`);
  par("sigilo mínimo", String(d.sigilo_minimo));
}

/* ---------- Momento 1 — Cédula ---------- */
/* As duas cédulas são DADOS REAIS do ledger: os dois compromissos que a
   primeira votante confidencial publicou. Um comete 1 e o outro comete 0.
   Rotular A e B em vez de "aprovar" e "rejeitar" é deliberado: assim que você
   nomeia, a pessoa para de olhar os bytes e começa a ler o rótulo. */
function momentoCedula(d) {
  const s = el("section");
  const marca06 = el("p", "marca-painel", "06 / 10 · III · QUALQUER PESSOA");
  selo(marca06); s.append(marca06);
  /* A primeira pergunta sigilosa: é dela que sai o par de compromissos.
     Numa cédula mista as públicas não têm o que mostrar aqui — elas já
     estão em claro no ledger. */
  const qSig = d.perguntas.findIndex((p) => p.confidencial);
  if (qSig < 0) {
    s.append(el("h1", null, d.perguntas[0]?.texto || "Cédula"));
    s.append(el("p", "dim", "Esta cédula é toda pública: não há compromisso a mostrar."));
    return s;
  }
  const pg = d.perguntas[qSig];
  s.append(el("h1", null, pg.texto));

  const sigilosos = d.votos.filter((v) => !v.publico && v.compromissos?.length >= 2);
  if (!sigilosos.length) {
    s.append(el("p", "dim", "Ninguém votou em segredo nesta proposta ainda."));
    return s;
  }
  const v = sigilosos[0];
  /* Onde começa a fatia desta pergunta dentro dos compromissos achatados. */
  const desloc = d.perguntas
    .slice(0, qSig)
    .filter((p) => p.confidencial)
    .reduce((a, p) => a + p.opcoes.length, 0);

  const sub = el("p", "dim");
  sub.textContent =
    "Mesma pessoa, mesma transação. Um comete um voto; o outro, a ausência dele.";
  s.append(sub);

  const par = el("div", "par-cedula");
  ["A", "B"].forEach((rot, i) => {
    const col = el("div");
    col.append(el("div", "cedula-rot", `Bloco ${rot}`));
    col.append(el("div", "hex", v.compromissos[desloc + i]));
    par.append(col);
  });
  s.append(par);

  const p2 = el("p", "peq dim");
  p2.style.marginTop = "14px";
  p2.textContent = `96 B cada. Um é "${pg.opcoes[0]}", o outro é "${pg.opcoes[1]}".`;
  s.append(p2);

  /* Esta frase não pode ser suavizada. É a única vez no produto em que um
     superlativo é literalmente correto, porque a garantia é
     information-theoretic e não computacional. (UX-CLI §2.2) */
  const dura = el("div", "frase-dura");
  dura.append(document.createTextNode("Não existe cálculo, computador ou tempo que diga qual é qual."));
  s.append(dura);
  const p3 = el("p", "peq dim");
  p3.style.marginTop = "12px";
  p3.textContent = "Nem hoje, nem em cinquenta anos.";
  s.append(p3);

  return s;
}

/* ---------- A grade. A imagem do pitch. ---------- */
/* A grade de blocos indistinguíveis não existe em terminal, e é a razão de
   este console existir (UX.md §7, Nível 2). */
function grade(d) {
  const s = el("section");

/* a mesa afirmou → o contrato conferiu → o resultado.
   A ordem é a arquitetura de confiança impressa de cima para baixo, e ensina
   sozinha por que não é preciso confiar na mesa. */
function momentoApuracao(d) {
  const s = el("section");
  s.append(el("p", "olho", "Momento 3 · apuração"));

  if (!d.apuracao) {
    s.append(el("h2", null, "Ainda não apurada"));
    const conf = d.votos.filter((v) => !v.publico).length;
    s.append(
      el("p", "dim",
        conf > 0 && conf < d.sigilo_minimo
          ? `Há ${conf} cédulas em segredo e o mínimo é ${d.sigilo_minimo}. ` +
            `Com tão poucas, publicar o total revelaria esses votos por subtração: ` +
            `quem votou em público é conhecido, e o resto sai por diferença. ` +
            `O contrato recusa, e nenhum voto foi perdido.`
          : "A janela de votação ainda está aberta.")
    );
    return s;
  }

  s.append(el("h2", null, "A mesa afirma. O contrato confere."));

  const afirmado = d.apuracao.afirmado || [];
  const conta = contagem(d, afirmado);

  const d1 = el("div", "degrau");
  d1.append(el("h3", null, "a mesa afirmou"));
  const dl = el("dl", "pares");
  conta.forEach((c) => {
    dl.append(el("dt", null, MAIUSC(c.rotulo)));
    dl.append(el("dd", null, c.confidencial
      ? `${c.segredo} em segredo + ${c.claro} em público`
      : `${c.claro} em público — esta pergunta é aberta`));
  });
  d1.append(dl);
  s.append(d1);

  const d2 = el("div", "degrau");
  d2.append(el("h3", null, "o contrato conferiu"));
  conta.filter((c) => c.confidencial).forEach((c) => {
    const l = el("div", "linha-v");
    l.append(el("span", "rot", `Acumulado ${MAIUSC(c.rotulo)}`));
    l.append(el("span", "val", `${c.segredo}·G + R·H`));
    l.append(el("span", d.apuracao.confere ? "ok" : "nao",
      d.apuracao.confere ? "✓ fecha" : "✗ não fecha"));
    d2.append(l);
  });
  const nota = el("p", "peq dim");
  nota.style.marginTop = "14px";
  nota.textContent =
    "Para afirmar outro total, a mesa teria de resolver um log discreto em " +
    "BLS12-381. Não é denúncia depois: é recusa na hora.";
  d2.append(nota);
  s.append(d2);

  const d3 = el("div", "degrau");
  d3.append(el("h3", null, "publicado"));
  const dl3 = el("dl", "pares");
  dl3.append(el("dt", null, "transação"));
  const dd3 = el("dd");
  const a3 = el("a", null, curto(d.apuracao.tx, 10, 4));
  a3.href = expert(d, "tx", d.apuracao.tx);
  a3.target = "_blank";
  a3.rel = "noopener";
  dd3.append(a3);
  dl3.append(dd3);
  dl3.append(el("dt", null, "ledger"));
  dl3.append(el("dd", null, num(d.apuracao.ledger)));
  dl3.append(el("dt", null, "endossos"));
  dl3.append(el("dd", null, `${d.mesa.limiar} de ${d.mesa.membros} membros da mesa`));
  d3.append(dl3);
  s.append(d3);

  /* O resultado vem DEPOIS da conferência e é a única linha centrada: a ordem
     comunica que o número só vale porque passou pelo bloco acima. */
  /* Um placar por pergunta. Numa cédula mista as duas naturezas aparecem
     lado a lado, e a diferença entre elas é dita, não deduzida. */
  let off = 0;
  d.perguntas.forEach((pg, q) => {
    const fatia = conta.slice(off, off + pg.opcoes.length);
    off += pg.opcoes.length;
    let vence = 0;
    fatia.forEach((c, j) => { if (c.total > fatia[vence].total) vence = j; });
    if (d.perguntas.length > 1) {
      const t = el("p", "peq dim");
      t.style.marginTop = "22px";
      t.textContent = `${q + 1}. ${pg.texto}  ·  ${pg.confidencial ? "em sigilo" : "em aberto"}`;
      s.append(t);
    }
    const placar = el("div", "placar");
    placar.append(document.createTextNode(MAIUSC(pg.opcoes[vence])));
    placar.append(el("small", null,
      fatia.map((c) => c.total).sort((a, b) => b - a).join(" a ") +
      " · " + num(d.votos.length) + " votos"));
    s.append(placar);
  });
  return s;
}

let dados = null, passo = 0, reciboQueimado = false, mesaMentindo = false;
let rascunho = [], erroRascunho = "";

/* ---------- A ponte ----------
   A página é estática, e página estática não assina transação. Quando
   `console/ponte.py` está no ar, cada botão desta demo chama a CLI e vira uma
   transação de verdade na testnet. Sem a ponte, a página continua sendo a
   reencenação de uma rodada real — é assim que ela funciona no GitHub Pages.

   Em outras palavras: a ponte não muda o que a tela afirma, muda o tempo
   verbal. */
const ponte = { viva: false, identidades: [], saida: "", ocupada: false, falha: "" };

async function chamar(verbo, corpo) {
  ponte.ocupada = true; ponte.falha = ""; mostrar();
  try {
    const r = await fetch(`/api/${verbo}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
    });
    const j = await r.json();
    ponte.saida = j.saida || j.erro || "";
    /* Recusa é resultado, não silêncio. Era o buraco mais feio do diário:
       um voto fora do prazo não deixava rastro nenhum na coluna. */
    if (j.ok) registrar(verbo, dados, j.estado);
    else {
      reg("cmd", `tessera ${verbo}`);
      const motivo = (j.saida || j.erro || "").split("\n")
        .map((l) => l.trim())
        .find((l) => l.startsWith("✗") || l.startsWith("❌") || l.includes("Error(Contract"));
      reg("x", motivo || "a rede recusou");
    }
    /* `ok: false` não é defeito: a recusa do contrato é um resultado da demo,
       e o painel de τ existe para mostrá-la. */
    if (!j.ok && !j.saida) ponte.falha = j.erro || "a ponte recusou";
    if (j.estado && valido(j.estado)) {
      const passoAtual = passo;
      desenhar(j.estado);
      passo = passoAtual;
    }
    return j;
  } catch (e) {
    ponte.falha = "a ponte caiu — ela ainda está rodando?";
    return { ok: false };
  } finally {
    ponte.ocupada = false; mostrar();
  }
}

async function sondarPonte() {
  try {
    const r = await fetch("/api/identidades");
    if (!r.ok) return;
    const j = await r.json();
    if (!j.ok) return;
    ponte.viva = true;
    ponte.identidades = j.identidades.filter((x) => x.tem_chave).map((x) => x.nome);
    await lerLedger();
    /* A ponte no ar significa que esta demo vota. Então ela não abre numa
       rodada gravada: abre sem proposta nenhuma, e a primeira coisa que
       acontece na tela é alguém criar uma. */
    const pedida = new URLSearchParams(location.search).get("p");
    if (!pedida) {
      dados = null; rascunho = RASCUNHO_PADRAO(); erroRascunho = "";
      passo = 0; cabecalho(null);
      document.title = "Tessera · ao vivo";
    }
    mostrar();
  } catch (_) { /* sem ponte: a reencenação continua valendo */ }
}

/* O relógio da demo, em ledgers. `apurar` só funciona depois de `fecha_em`, e
   é melhor a tela contar junto do que o contrato recusar com #7 na frente de
   todo mundo. Um ledger da testnet leva ~5 s, então `1m` são 12 ledgers — e
   uma rodada inteira cabe em pouco mais de um minuto. */
async function lerLedger() {
  try {
    const r = await fetch("/api/ledger");
    const j = await r.json();
    if (j.ok) { ponte.ledger = j.ledger; return j.ledger; }
  } catch (_) {}
  return null;
}
function faltam(d) {
  if (!d || !ponte.ledger || !d.prazo_ledger) return null;
  return d.prazo_ledger - ponte.ledger;
}
function relogio(d) {
  const f = faltam(d);
  if (f === null) return "";
  if (f <= 0) return "encerrada";
  const seg = f * 5;
  return seg < 60 ? `faltam ~${seg}s` : `faltam ~${Math.ceil(seg/60)}min`;
}
function textoRelogio(d) {
  const f = faltam(d);
  if (f === null) return "";
  return f <= 0 ? "✓ prazo encerrado · pode apurar"
                : `${relogio(d)} · ledger ${num(ponte.ledger)} de ${num(d.prazo_ledger)}`;
}
/* Enquanto a votação está aberta, a tela se atualiza sozinha. Sem isso alguém
   teria de ficar apertando F5 na frente da câmera. */
let pulso = null;

/* Enquanto a votação está aberta, a tela se atualiza sozinha — sem isso
   alguém teria de ficar apertando F5 na frente da câmera.

   O ritmo é reagendado a cada batida, e não fixado uma vez: longe do fim não
   há o que ver mudar e bater de 5 em 5 s só enche o log da ponte; perto do fim
   a contagem precisa ser fina, porque é ela que libera a apuração. */
function bater(d) {
  clearTimeout(pulso);
  if (!ponte.viva || !d || !d.prazo_ledger || d.apuracao) return;

  const proxima = () => {
    const f = faltam(dados);
    return f !== null && f * 5 > 90 ? 20000 : 5000;
  };

  const tique = async () => {
    const antes = faltam(dados) <= 0;
    await lerLedger();
    /* Redesenhar o palco inteiro arrancaria o botão de baixo do dedo de quem
       está votando. No tique comum só o relógio e o diário mudam; o palco só
       é refeito quando o prazo vira, porque aí a apuração precisa aparecer. */
    if (faltam(dados) <= 0 && !antes) { mostrar(); return; }
    const r = document.querySelector("[data-relogio]");
    if (r) r.textContent = textoRelogio(dados);
    const dv = document.querySelector(".diario");
    if (dv && dv.childElementCount !== diario.slice(-120).length) dv.replaceWith(rolo());
    pulso = setTimeout(tique, proxima());
  };
  pulso = setTimeout(tique, proxima());
}

/* ---------- O diário ----------

   A coluna da direita não é um texto de apoio: é o registro do que acabou de
   acontecer, escrito enquanto acontece. Cada ação da tela empilha aqui as
   funções que rodaram e os valores que saíram delas.

   Nada é inventado. Hash, transação, ledger, taxa e tamanho vêm do estado que
   a CLI gravou ou da saída que ela imprimiu. O que o diário acrescenta são os
   nomes das funções — e esses são os mesmos que a guarda confere.          */
const diario = [];
function reg(cls, txt) { diario.push({ h: new Date(), cls, txt }); }
function regs(cls, linhas) { linhas.forEach((l) => reg(cls, l)); }

const hhmmss = (d) =>
  [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map((x) => String(x).padStart(2, "0")).join(":");

/* ── o que cada verbo escreve ── */

function registrarAbertura(d) {
  reg("cmd", `tessera abrir --proposta ${d.proposta}`);
  reg("fn",  `merkle::folha  × ${d.aptos.length}`);
  reg("fn",  "merkle::no     até a raiz");
  reg("val", `raiz_aptos = ${d.raiz_aptos}`);
  reg("com", "32 bytes no contrato. A lista não vai.");
  reg("fn",  `shamir::repartir  ${d.mesa.limiar} de ${d.mesa.membros}`);
  reg("com", "as parcelas reconstroem Σr, nunca um voto");
  d.perguntas.forEach((pg, i) =>
    reg("val", `perguntas[${i}] = { opcoes: ${pg.opcoes.length}, confidencial: ${pg.confidencial} }`));
  reg("val", `fecha_em = ledger ${d.prazo_ledger}`);
  if (d.abertura_tx) reg("tx", `tx ${d.abertura_tx}`);
  reg("ok",  "votação aberta");
}

function registrarVoto(d, v) {
  const conf = d.perguntas.filter((p) => p.confidencial);
  const nOpc = conf.reduce((a, p) => a + p.opcoes.length, 0);
  reg("cmd", `tessera votar --proposta ${d.proposta} --identidade ${v.identidade}`);
  reg("fn",  `merkle::verificar  caminho → raiz`);
  if (v.publico) {
    reg("com", "cédula aberta por escolha de quem vota");
    reg("val", `escolhas = [${(v.escolhas || []).join(", ")}]`);
  } else {
    reg("fn",  `pedersen::acaso_fr()  × ${nOpc}`);
    reg("ocl", "r fica na máquina de quem vota");
    reg("fn",  "pedersen::comprometer   C = v·G + r·H");
    (v.compromissos || []).forEach((c, j) => {
      reg("hex", `C${j} = ${c.slice(0, 40)}…`);
      diario[diario.length - 1].cheio = c;
    });
    reg("fn",  `cds::provar   × ${(v.provas || []).length}   ${(v.provas || []).length * 320} B`);
    reg("com", "um ramo real, um fabricado — indistinguíveis");
    reg("fn",  `soma::provar  × ${(v.provas_soma || []).length}   ${(v.provas_soma || []).length * 128} B`);
    reg("com", "uma por pergunta: ninguém compensa entre elas");
    const bytes = (v.compromissos || []).length * 96
                + (v.provas || []).length * 320
                + (v.provas_soma || []).length * 128;
    reg("val", `carga da cédula = ${bytes} B`);
  }
  if (v.tx) reg("tx", `tx ${v.tx}   ledger ${v.ledger}`);
  reg("ok", `${v.identidade} está na contagem`);
}

function registrarApuracao(d) {
  reg("cmd", `tessera apurar --proposta ${d.proposta}`);
  const conf = d.votos.filter((x) => !x.publico).length;
  reg("val", `confidenciais = ${conf}   τ = ${d.sigilo_minimo}`);
  if (conf > 0 && conf < d.sigilo_minimo) {
    reg("fn", "lib.rs: if confidenciais < TAU");
    reg("x",  `${conf} < ${d.sigilo_minimo} → Error(Contract, #19)`);
    return;
  }
  reg("fn", `shamir::juntar  ${d.mesa.limiar} parcelas → Σr`);
  reg("fn", "pedersen::verifica_agregado  A == total·G + Σr·H");
  if (d.apuracao) {
    reg("tx", `tx ${d.apuracao.tx || ""}   ledger ${d.apuracao.ledger || ""}`);
    reg("ok", "resultado publicado");
  }
}

/* Chamado depois de cada ação, com o estado novo em mãos. */
function registrar(verbo, antes, depois) {
  if (!depois) return;
  if (verbo === "abrir")  return registrarAbertura(depois);
  if (verbo === "apurar") return registrarApuracao(depois);
  if (verbo === "votar") {
    const vistos = new Set((antes?.votos || []).map((v) => v.tx));
    const novos = (depois.votos || []).filter((v) => !vistos.has(v.tx));
    if (!novos.length) return;
    return novos.forEach((v) => registrarVoto(depois, v));
  }
  if (verbo === "queimar") {
    reg("cmd", "tessera queimar");
    reg("fn",  "recibo::queimar  sobrescreve o arquivo");
    reg("ok",  "nem quem votou prova mais o próprio voto");
  }
  if (verbo === "verificar") {
    reg("cmd", `tessera verificar --proposta ${depois.proposta}`);
    reg("com", "outro processo, em Rust. esta página não roda BLS12-381.");
  }
}

/* O rolo. Sempre mostra o fim, que é onde está o que acabou de acontecer. */
function rolo() {
  const cx = el("div", "diario");
  if (!diario.length) {
    cx.append(el("div", "t-com", "// nada aconteceu ainda"));
    return cx;
  }
  diario.slice(-120).forEach((l, i, todas) => {
    const d = el("div", "d-linha");
    const abre = l.cls === "cmd" || i === 0;
    d.append(el("span", "d-hora", abre ? hhmmss(l.h) : ""));
    const corpo = el("span", "d-" + l.cls, l.txt);
    if (l.cheio) corpo.title = l.cheio;
    d.append(corpo);
    cx.append(d);
  });
  requestAnimationFrame(() => { cx.scrollTop = cx.scrollHeight; });
  return cx;
}

/* ---------- O terminal da mecânica ----------

   A coluna da direita não resume o que acontece: ela mostra o código que faz
   acontecer, com os valores desta rodada passando por ele. As linhas `cod` são
   recortes literais de `core/src/*.rs` — se o código mudar e isto não mudar
   junto, a demo passa a mentir.

   Tipos de linha:
     ["cod", texto]            fonte, como está no crate
     ["val", chave, valor]     um valor de verdade desta rodada
     ["oculto", chave, porque] um valor que a demo se recusa a mostrar
     ["//", texto]             comentário
     ["ok", texto] / ["x", t]  veredito
     ["nota", texto]           a frase em prosa, no fim e só uma
     []                        linha em branco                                */
function terminalMecanica(arquivo, linhas) {
  const m = el("aside","mecanica");
  /* Em cima o que aconteceu, embaixo o código que fez acontecer. */
  if (ponte.viva) {
    texto(m,"div","term-topo","o que está acontecendo");
    m.append(rolo());
  }
  texto(m,"div","term-topo", arquivo || "");
  const t = el("div","term");
  linhas.forEach((l) => {
    if (!l || !l.length) { t.append(el("div","t-vazio")); return; }
    const [tipo, a, b] = l;
    if (tipo === "cod")   return t.append(el("div","t-cod", a));
    if (tipo === "//")    return t.append(el("div","t-com", "// " + a));
    if (tipo === "ok")    return t.append(el("div","t-ok", "✓ " + a));
    if (tipo === "x")     return t.append(el("div","t-x", "✗ " + a));
    if (tipo === "nota")  return t.append(el("p","t-nota", a));
    if (tipo === "oculto") {
      const d = el("div"); d.append(el("span","t-chv", a + " = "));
      d.append(el("span","t-oculto","          "));
      d.append(el("span","t-com","  " + b)); return t.append(d);
    }
    const d = el("div");
    d.append(el("span","t-chv", a + " = "));
    d.append(el("span","t-val", b));
    t.append(d);
  });
  m.append(t);
  return m;
}

/* Sete aptos: quatro votam em segredo, três abrem o voto. 4 < τ = 5. */
async function rodarTau() {
  const nome = "coligacao-" + Date.now().toString(36).slice(-5);
  const dizer = (f) => { tau.fase = f; mostrar(); };

  tau.proposta = nome; tau.saida = ""; tau.ledger = 0;
  dizer("abrindo a proposta…");
  let j = await fetch("/api/abrir", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ proposta: nome, prazo: "5m", limiar: 3,
      /* O prazo precisa aguentar a pior volta, não a média.
         Medido numa rodada real: três votos em 10 s e 5 s, e então uma parada
         de 140 s antes do quarto — provavelmente o Horizon respondendo devagar
         para a consulta de taxa e ledger. Com 3m a fila morria no quinto voto.
         5m absorve uma parada dessas e ainda sobra. */
      perguntas: [{ texto:"Manter a coligação?", opcoes:["manter","rescindir"], confidencial:true }] }) }).then(r=>r.json());
  if (!j.ok) { tau.saida = j.saida || j.erro || ""; return dizer("✗ não consegui abrir"); }
  tau.ledger = (j.estado && j.estado.prazo_ledger) || 0;
  registrar("abrir", null, j.estado);

  const quem = ponte.identidades.slice(0,7);
  for (let i = 0; i < quem.length; i++) {
    const aberto = i >= 4;            // os três últimos revelam o voto
    /* Se o prazo está por fechar, parar aqui é melhor que gastar um voto que
       vai ser recusado — e deixa claro que foi o relógio, não o protocolo. */
    await lerLedger();
    if (ponte.ledger && tau.ledger && (tau.ledger - ponte.ledger) * 5 < 20) {
      return dizer(`✗ o prazo fecha em instantes · pararam ${i} de ${quem.length} votos`);
    }
    dizer(`${quem[i]} votando ${aberto ? "com o voto aberto" : "em segredo"} · ${i+1} de ${quem.length} · ${relogio({prazo_ledger: tau.ledger})}`);
    j = await fetch("/api/votar", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ proposta: nome, identidade: quem[i], opcoes:["manter"], publico: aberto }) }).then(r=>r.json());
    if (j.ok) registrar("votar", { votos: (j.estado?.votos || []).slice(0, i) }, j.estado);
    if (!j.ok) {
      tau.saida = j.saida || j.erro || "";
      const tarde = ponte.ledger && tau.ledger && ponte.ledger >= tau.ledger;
      return dizer(tarde
        ? `✗ o prazo fechou antes de ${quem[i]} votar — abra de novo com prazo maior`
        : `✗ ${quem[i]} não conseguiu votar`);
    }
  }

  dizer("4 em segredo, 3 abriram o voto · esperando o prazo");
  while (true) {
    await lerLedger(); mostrar();
    if (ponte.ledger >= tau.ledger) break;
    await new Promise((r) => setTimeout(r, 5000));
  }

  dizer("a mesa tenta apurar…");
  j = await fetch("/api/apurar", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ proposta: nome }) }).then(r=>r.json());
  registrar("apurar", null, j.estado);
  tau.saida = j.saida || j.erro || "";
  dizer(tau.saida.includes("#19") ? "✗ o contrato recusou · nada foi publicado"
                                  : "✓ terminou — veja a saída");
}

function valido(d) {
  return d && Array.isArray(d.perguntas) && d.perguntas.length > 0 &&
         d.perguntas.every((p) => Array.isArray(p.opcoes) && p.opcoes.length >= 2) &&
         Array.isArray(d.votos) && Array.isArray(d.aptos) && d.mesa;

/* O instantâneo embutido é uma rodada de verdade na testnet, para que a página
   abra mostrando algo em vez de um formulário vazio. `?p=<proposta>` lê o JSON
   que a CLI gravou ao lado; o seletor de arquivo serve para qualquer outro. */
function inicial() {
  try {
    const bruto = document.getElementById("instantaneo").textContent.trim();
    if (bruto && bruto.charAt(0) === "{") {
      const d = JSON.parse(bruto);
      if (valido(d)) return d;
    }
  } catch (_) {}
  return null;
}

const embutido = inicial();
if (embutido) desenhar(embutido);

/* Se a ponte responder, a demo deixa de ser reencenação. */
sondarPonte();

const p = new URLSearchParams(location.search).get("p");
if (p && /^[a-zA-Z0-9_-]+$/.test(p)) {
  /* Com a ponte no ar o estado vem pela API; sem ela, do arquivo ao lado. */
  fetch(`/api/estado?p=${p}`)
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
    .then((j) => { if (j.ok && valido(j.estado)) desenhar(j.estado); else throw new Error("vazio"); })
    .catch(() =>
      fetch(`../estado/${p}.json`)
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
        .then((d) => { if (valido(d)) desenhar(d); })
        .catch(() => erro(`Não encontrei o estado de ${p}.`))
    );
}

$("#arq").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  $("#erro").hidden = true;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(String(fr.result));
      if (!valido(d)) throw new Error("formato");
      desenhar(d);
      scrollTo({ top: 0, behavior: "smooth" });
    } catch (_) {
      erro("Esse arquivo não é um estado do Tessera.");
    }
  };
  fr.onerror = () => erro("Não consegui ler o arquivo.");
  fr.readAsText(f);
});
