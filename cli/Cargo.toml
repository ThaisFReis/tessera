[package]
name = "tessera-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cliente de linha de comando do Tessera."

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
tessera-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
